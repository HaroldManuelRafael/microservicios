info:
  name: Crear un modulo
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:3010/api/administracion/modulos
  body:
    type: json
    data: |-
      {
        "nombre":"Seguridad",
        "icono":"fa-user-lock",
        "description": "Seguridad del sistema"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
